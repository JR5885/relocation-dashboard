<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relocation Command Center</title>
    <!-- 引入 PapaParse 用來在前端解析 Google 試算表的 CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root{
            --bg:#0B141C; --surface:#121F29; --surface-raised:#1A2C39; --border:#2B4152;
            --text:#EDF2F5; --text-muted:#93A7B8; --accent:#C98A3A; --accent-strong:#E7B067;
            --green:#3DDC8C; --green-soft:rgba(61,220,140,0.14);
            --amber:#F2B84B; --red:#F2685C; --shadow:0 10px 28px rgba(0,0,0,0.4);
        }
        *{box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;margin:0;padding:28px 24px;}
        .wrap{max-width:1280px;margin:0 auto;}
        .masthead{margin-bottom:24px;}
        .brand-eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px;}
        .brand-title{font-size:36px;font-weight:800;margin:0;}
        .brand-sub{color:var(--text-muted);font-size:14px;margin-top:6px;}
        
        .card-container{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-top:20px;}
        table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px;}
        th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);}
        th{color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.05em;background:var(--surface-raised);}
        .badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;}
        .badge-sg{background:var(--green-soft);color:var(--green);}
        .loading{text-align:center;padding:40px;color:var(--text-muted);font-size:16px;}
    </style>
</head>
<body>

<div class="wrap">
    <div class="masthead">
        <p class="brand-eyebrow">GM-Robot · Tech-PMO Command Center</p>
        <h1 class="brand-title">Relocation Blitz — Live Sync Dashboard</h1>
        <p class="brand-sub">即時同步 Google 試算表（RELOCATION PROJECT）之 122 人專案追蹤清單。</p>
    </div>

    <div class="card-container">
        <h3>📊 移居專案即時清單</h3>
        <div id="loading" class="loading">正在從 Google 試算表載入最新資料...</div>
        <div style="overflow-x:auto;">
            <table id="data-table" style="display:none;">
                <thead>
                    <tr>
                        <th>員工編號</th>
                        <th>姓名</th>
                        <th>區域</th>
                        <th>目前狀態</th>
                        <th>預算配置</th>
                        <th>已花費</th>
                        <th>預定抵達日</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 動態載入資料 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 您提供的最新 Google 試算表公開 CSV 連結
    const gsheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQUem3z16ko71Gyz_80gTFiw7C_O9UkoBcJP8nAWabx1ikg23ujAUlEwyVTr4s-rguZ1DKbuDVkZB8c/pub?output=csv";

    Papa.parse(gsheetCsvUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data;
            const tbody = document.getElementById("table-body");
            document.getElementById("loading").style.display = "none";
            document.getElementById("data-table").style.display = "table";

            let html = "";
            data.forEach(row => {
                if(row.EmployeeID) { // 過濾空行
                    html += `<tr>
                        <td><strong>${row.EmployeeID || ''}</strong></td>
                        <td>${row.EmployeeName || ''}</td>
                        <td><span class="badge badge-sg">${row.Region || ''}</span></td>
                        <td>${row.Status || ''}</td>
                        <td>$${row.BudgetAllocated || '0'}</td>
                        <td>$${row.BudgetSpent || '0'}</td>
                        <td>${row.TargetArrivalDate || ''}</td>
                    </tr>`;
                }
            });
            tbody.innerHTML = html;
        },
        error: function(err) {
            document.getElementById("loading").innerText = "載入資料失敗，請檢查網路或 CSV 連結權限。";
            console.error("CSV Parse Error:", err);
        }
    });
</script>

</body>
</html>
